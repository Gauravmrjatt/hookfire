apiVersion: v1
kind: ConfigMap
metadata:
  name: hookfire-config
  namespace: hookfire
data:
  PORT: "8080"
  ENV: production
  LOG_LEVEL: info
  REDIS_URL: redis://redis.hookfire.svc.cluster.local:6379/0
  JWT_EXPIRATION: "12h"
  WORKER_COUNT: "10"
  QUEUE_SIZE: "1000"
  REQUEST_TIMEOUT: "10s"
  MAX_RETRIES: "7"
  INITIAL_RETRY_DELAY: "5s"
  MAX_RETRY_DELAY: "15m"
  BACKOFF_MULTIPLIER: "2"
  JITTER_FRACTION: "0.25"
  DEFAULT_RATE_LIMIT: "100"
  RATE_LIMIT_FAIL_OPEN: "true"
  DISPATCHER_INTERVAL: "1s"
  STALE_PROCESSING_TIMEOUT: "2m"
  ENDPOINT_CONCURRENCY: "1"
