apiVersion: v1
kind: Secret
metadata:
  name: hookfire-secrets
  namespace: hookfire
type: Opaque
stringData:
  # managed via kubectl apply from your secret manager or sealed-secrets;
  # never commit production values (PRD §37)
  JWT_SECRET: "REPLACE_ME"
  DATABASE_URL: "postgres://webhook:REPLACE_ME@postgres.hookfire.svc.cluster.local:5432/webhook_engine?sslmode=disable"
